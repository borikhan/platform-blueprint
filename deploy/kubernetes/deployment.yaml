apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-blueprint
spec:
  replicas: 3
  selector:
    matchLabels: {app: platform-blueprint}
  template:
    metadata:
      labels: {app: platform-blueprint}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: service
          image: ghcr.io/borikhan/platform-blueprint:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            - {name: APP_ENV, value: production}
            - {name: RELEASE_SHA, valueFrom: {fieldRef: {fieldPath: metadata.labels['release']}}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: platform-blueprint}
spec:
  selector: {app: platform-blueprint}
  ports: [{port: 80, targetPort: 8080}]
